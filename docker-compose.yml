# Infinity Sports web app + optional local Postgres for development
services:
  postgres:
    image: postgres:16-alpine
    container_name: infinity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinity
      POSTGRES_PASSWORD: infinity
      POSTGRES_DB: infinity_sports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinity -d infinity_sports"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: infinity-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://infinity:infinity@postgres:5432/infinity_sports
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
